<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Trakkr — Make your next subway trip smarter.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a5c"/>
      <stop offset="0.55" stop-color="#0039A6"/>
      <stop offset="1" stop-color="#FF6319"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0039A6"/>
      <stop offset="1" stop-color="#FF6319"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.85" cy="0.15" r="0.4">
      <stop offset="0" stop-color="#FF6319" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FF6319" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#0039A6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0039A6" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      .wordmark {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 64px;
        letter-spacing: -0.02em;
        fill: url(#word);
      }
      .badge {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #FFB494;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .headline {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 96px;
        line-height: 0.95;
        fill: #ffffff;
        letter-spacing: -0.03em;
      }
      .accent {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 96px;
        fill: #FF6319;
        letter-spacing: -0.03em;
      }
      .subhead {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 26px;
        fill: #B5C4FF;
        letter-spacing: 0;
      }
      .footer-tag {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: rgba(255,255,255,0.6);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    ]]></style>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Top wordmark -->
  <g transform="translate(72, 90)">
    <text class="wordmark" x="0" y="0">Trakkr</text>
  </g>

  <!-- Live indicator dot + tagline -->
  <g transform="translate(72, 130)">
    <circle cx="9" cy="9" r="6" fill="#FF6319"/>
    <circle cx="9" cy="9" r="9" fill="#FF6319" fill-opacity="0.35"/>
    <text class="badge" x="28" y="14">Powered by TrakkRecord™</text>
  </g>

  <!-- Big headline -->
  <g transform="translate(72, 280)">
    <text class="headline" x="0" y="0">Make your next</text>
    <text class="headline" x="0" y="100">subway trip</text>
    <text class="accent"   x="0" y="200">smarter.</text>
  </g>

  <!-- Subhead -->
  <g transform="translate(72, 540)">
    <text class="subhead" x="0" y="0">Free transit safety forecasts for every NYC station.</text>
  </g>

  <!-- Footer tag -->
  <g transform="translate(72, 590)">
    <text class="footer-tag" x="0" y="0">trakkr.app</text>
  </g>

  <!-- Decorative subway-line bullet rail along bottom-right -->
  <g transform="translate(840, 460)">
    <circle cx="0"   cy="0" r="32" fill="#EE352E"/>
    <text x="0" y="11" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="28" fill="#fff">1</text>

    <circle cx="74"  cy="0" r="32" fill="#00933C"/>
    <text x="74" y="11" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="28" fill="#fff">4</text>

    <circle cx="148" cy="0" r="32" fill="#0039A6"/>
    <text x="148" y="11" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="28" fill="#fff">A</text>

    <circle cx="222" cy="0" r="32" fill="#FF6319"/>
    <text x="222" y="11" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="28" fill="#fff">F</text>

    <circle cx="296" cy="0" r="32" fill="#FCCC0A"/>
    <text x="296" y="11" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="28" fill="#000">N</text>
  </g>
</svg>
